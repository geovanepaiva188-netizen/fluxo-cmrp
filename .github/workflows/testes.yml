name: Testes do robô
on:
  push:
    paths: ['robo/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r robo/requirements.txt
      - run: python -m pytest robo -q

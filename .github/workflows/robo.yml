name: Robô do Fluxo
# Lê as contas LocaWeb conectadas no app e atualiza o Firebase.
# Repositório público: a cada 10 minutos. Repositório privado: troque para '*/15 * * * *' para ficar no plano grátis.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: robo
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: robo/requirements.txt
      - run: pip install -q -r robo/requirements.txt
      - name: Rodar o robô (somente leitura dos e-mails)
        working-directory: robo
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ROBO_SEGREDO: ${{ secrets.ROBO_SEGREDO }}
        run: python main.py

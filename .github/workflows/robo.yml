name: Robô do Fluxo
# Lê as contas LocaWeb conectadas no app e atualiza o Firebase.
# O GitHub grátis costuma atrasar os agendamentos (dispara a cada 45-90 min). Por isso cada rodada fica
# ligada ~1 hora lendo o e-mail a cada 10 min; a próxima rodada agendada espera na fila e emenda.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: robo
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: robo/requirements.txt
      - run: pip install -q -r robo/requirements.txt
      - name: Rodar o robô (somente leitura dos e-mails)
        working-directory: robo
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ROBO_SEGREDO: ${{ secrets.ROBO_SEGREDO }}
        run: |
          fim=$(( $(date +%s) + 55 * 60 ))
          while true; do
            inicio=$(date +%s)
            python main.py || echo "rodada com erro; tenta de novo em 10 min"
            proxima=$(( inicio + 600 ))
            [ "$proxima" -ge "$fim" ] && break
            espera=$(( proxima - $(date +%s) ))
            [ "$espera" -gt 0 ] && sleep "$espera"
          done
